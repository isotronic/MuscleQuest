# Quick check, for routine runs: onboarding with a starter plan, a plan
# workout with the rest timer, and a quick workout that survives the app
# being killed. The flows run in order on one install.
appId: com.isotronic.musclequest
---
- runFlow: flows/start-with-plan.yml
- runFlow: flows/plan-workout.yml
- runFlow: flows/quick-workout.yml
