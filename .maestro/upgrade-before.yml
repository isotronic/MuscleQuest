# Upgrade install, part 1, on the old build (scripts/e2e-upgrade-install.sh):
# onboarding with a starter plan, then a plan workout with one set logged,
# left in progress with the app in the background.
appId: com.isotronic.musclequest
---
- runFlow: flows/start-with-plan.yml
- scrollUntilVisible:
    element:
      id: "today-start"
    timeout: 15000
- tapOn:
    id: "today-start"
- extendedWaitUntil:
    visible:
      id: "workout-exercise-0"
    timeout: 15000
- tapOn:
    id: "workout-exercise-0"
- runFlow:
    file: flows/log-set.yml
    env:
      WEIGHT: "60"
      REPS: "8"
- extendedWaitUntil:
    visible:
      id: "rest-skip"
    timeout: 15000
- tapOn:
    id: "rest-skip"
# The session now sits on the second set. Matched by its text: builds older
# than this flow have no session-set-position testID. English device.
- extendedWaitUntil:
    visible: "Set 2 of \\d+"
    timeout: 15000
- pressKey: Home
