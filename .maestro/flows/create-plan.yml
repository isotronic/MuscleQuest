# From home: build a plan with one workout and one exercise and find it on
# the plans tab.
appId: com.isotronic.musclequest
---
- tapOn:
    id: "tab-plans"
- extendedWaitUntil:
    visible:
      id: "plans-new-plan"
    timeout: 15000
- tapOn:
    id: "plans-new-plan"
- extendedWaitUntil:
    visible:
      id: "plan-name-input"
    timeout: 15000
- tapOn:
    id: "plan-name-input"
- inputText: "E2E Plan"
- hideKeyboard
- tapOn:
    id: "plan-add-workout"
- tapOn:
    id: "workout-name-input-0"
- inputText: "Day A"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "workout-add-exercise-0"
- tapOn:
    id: "workout-add-exercise-0"
- extendedWaitUntil:
    visible:
      id: "exercise-search"
    timeout: 15000
- tapOn:
    id: "exercise-search"
- inputText: "Squat"
- hideKeyboard
- tapOn:
    id: "exercise-select"
    index: 0
- tapOn:
    id: "exercise-picker-add"
- extendedWaitUntil:
    visible:
      id: "plan-save"
    timeout: 15000
- tapOn:
    id: "plan-save"
- runFlow:
    when:
      notVisible:
        id: "plans-new-plan"
    commands:
      - tapOn:
          id: "tab-plans"
- scrollUntilVisible:
    element: "E2E Plan"
    timeout: 15000
