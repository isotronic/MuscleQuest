# From home: log a body weight in the quick-log card and see it in settings,
# then switch the weight unit and see it converted.
appId: com.isotronic.musclequest
---
- scrollUntilVisible:
    element:
      id: "measurement-input-1"
    timeout: 15000
- tapOn:
    id: "measurement-input-1"
- inputText: "180"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "measurement-log-button"
- tapOn:
    id: "measurement-log-button"
- tapOn:
    id: "tab-more"
- tapOn:
    id: "menu-settings"
- tapOn:
    id: "settings-profile"
- scrollUntilVisible:
    element: ".*180.*"
    timeout: 15000
- back
- tapOn:
    id: "settings-units"
- tapOn:
    id: "setting-weight-unit"
- tapOn:
    id: "setting-option-kg"
- tapOn:
    id: "settings-modal-save"
- back
- tapOn:
    id: "settings-profile"
# 180 lb is 81.65 kg, in either decimal separator.
- scrollUntilVisible:
    element: ".*81[.,][67].*"
    timeout: 15000
- back
- back
- tapOn:
    id: "tab-home"
