# From home with the starter plan active and progression on: turn deload week
# on and off, and copy a plan workout to Your workouts. Duplicating is only
# offered for plans you made, so plan-editing.yml covers it.
appId: com.isotronic.musclequest
---
- runFlow: open-plans-tab.yml
- tapOn:
    id: "plan-card"
    index: 0
- scrollUntilVisible:
    element:
      id: "plan-deload-toggle"
    timeout: 15000
- tapOn:
    id: "plan-deload-toggle"
- tapOn:
    id: "plan-deload-toggle"
- scrollUntilVisible:
    element:
      id: "plan-workout-copy-0"
    direction: UP
    timeout: 15000
- tapOn:
    id: "plan-workout-copy-0"
- tapOn:
    id: "copy-modal-confirm"
- runFlow: wait-for-snackbar.yml
- tapOn:
    id: "tab-home"
