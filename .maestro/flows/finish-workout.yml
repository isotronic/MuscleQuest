# From the workout overview with sets still open: finish anyway.
appId: com.isotronic.musclequest
---
- extendedWaitUntil:
    visible:
      id: "workout-finish"
    timeout: 15000
- tapOn:
    id: "workout-finish"
# The "Finish anyway" button of a native alert, by its Android id so it works
# in any language.
- extendedWaitUntil:
    visible:
      id: "android:id/button1"
    timeout: 15000
- tapOn:
    id: "android:id/button1"
# A plan or saved workout whose sets changed (rest, weight or reps) asks
# whether to update it; keep it as is. Matched by text until the next build
# carries the workout-changes-keep id.
- extendedWaitUntil:
    visible: "Keep (plan|workout) as is"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "Keep (plan|workout) as is"
    commands:
      - tapOn: "Keep (plan|workout) as is"
