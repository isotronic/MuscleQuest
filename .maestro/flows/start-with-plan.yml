# Fresh install that picks the first starter plan and makes it active.
appId: com.isotronic.musclequest
---
- runFlow: onboarding.yml
- tapOn:
    id: "starter-plan-0"
- extendedWaitUntil:
    visible:
      id: "plan-activate"
    timeout: 15000
- tapOn:
    id: "plan-activate"
# The plans list sits under the overview: Back lands on it.
- back
- extendedWaitUntil:
    visible:
      id: "plans-new-plan"
    timeout: 15000
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible:
      id: "home-choose-workout"
    timeout: 15000
