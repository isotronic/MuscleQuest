# Fresh install to the home tab, skipping the starter plans.
appId: com.isotronic.musclequest
---
- runFlow: onboarding.yml
- tapOn:
    id: "get-started-skip"
# Home on a fresh install opens with a large activation card, so check the
# tab instead of a button that may be below the fold.
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 15000
