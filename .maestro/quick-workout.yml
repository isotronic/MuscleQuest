# Log one set in a quick workout, finish it, and find it in the stats tab.
appId: com.isotronic.musclequest
---
- runFlow: first-launch.yml
- scrollUntilVisible:
    element:
      id: "home-quick-workout"
    timeout: 15000
- tapOn:
    id: "home-quick-workout"
- extendedWaitUntil:
    visible:
      id: "workout-add-exercise"
    timeout: 15000
- tapOn:
    id: "workout-add-exercise"
- extendedWaitUntil:
    visible:
      id: "exercise-search"
    timeout: 15000
- tapOn:
    id: "exercise-search"
- inputText: "Bench Press"
- hideKeyboard
- tapOn:
    id: "exercise-select"
    index: 0
- tapOn:
    id: "exercise-picker-add"
- extendedWaitUntil:
    visible:
      id: "workout-exercise-0"
    timeout: 15000
- tapOn:
    id: "workout-exercise-0"
- extendedWaitUntil:
    visible:
      id: "complete-set"
    timeout: 15000
# The session keeps the neighbouring sets mounted off-screen, each with the
# same ids, so every tap is scoped to the set on screen.
- tapOn:
    id: "set-weight-input"
    childOf:
      id: "session-current-set"
- eraseText
- inputText: "60"
# The keyboard covers the reps field.
- hideKeyboard
- tapOn:
    id: "set-reps-input"
    childOf:
      id: "session-current-set"
- eraseText
- inputText: "8"
- hideKeyboard
- tapOn:
    id: "complete-set"
    childOf:
      id: "session-current-set"
- back
- extendedWaitUntil:
    visible:
      id: "workout-finish"
    timeout: 15000
- tapOn:
    id: "workout-finish"
# The exercise's other sets are still open.
- extendedWaitUntil:
    visible: "Finish anyway"
    timeout: 15000
- tapOn: "Finish anyway"
# A quick workout always offers to save itself as a workout once it is saved.
# Its name field takes focus, and the keyboard covers the buttons.
- extendedWaitUntil:
    visible: "Save as a reusable workout?"
    timeout: 30000
- hideKeyboard
- tapOn:
    id: "save-workout-not-now"
# Done sits at the bottom of the summary.
- scrollUntilVisible:
    element:
      id: "summary-done"
    timeout: 30000
- tapOn:
    id: "summary-done"
- tapOn:
    id: "tab-stats"
- scrollUntilVisible:
    element: "(?i)quick workout"
    timeout: 15000
