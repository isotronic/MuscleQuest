# Everything, before a release. The flows run in order on one install, so
# each starts and ends on home. Order matters: progression needs the starter
# plan still active, plan editing deletes the plan it activates, and the
# body weight flow switches the weight unit, so it runs last.
appId: com.isotronic.musclequest
---
- runFlow: flows/start-with-plan.yml
- runFlow: flows/plan-workout.yml
- runFlow: flows/quick-workout.yml
- runFlow: flows/progression.yml
- runFlow: flows/superset-session.yml
- runFlow: flows/list-logging.yml
- runFlow: flows/history-edit.yml
- runFlow: flows/custom-exercise.yml
- runFlow: flows/plan-editing.yml
- runFlow: flows/stats-customize.yml
- runFlow: flows/navigation.yml
- runFlow: flows/body-weight.yml
