# Maestro smoke flows on an Android emulator. Manual only: run
# `eas workflow:run .eas/workflows/e2e-android.yml` from a local checkout, so
# the upload includes the gitignored google-services.json, assets/db/ and
# assets/data/ (a GitHub-triggered run would not have them).
#
# The test job is a custom job rather than the pre-packaged `maestro` type,
# which needs a paid EAS plan.
name: E2E Android

jobs:
  build:
    type: build
    params:
      platform: android
      profile: e2e-test

  maestro:
    needs: [build]
    # Android emulators need a nested-virtualization worker.
    runs_on: linux-medium-nested-virtualization
    steps:
      - uses: eas/checkout
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ needs.build.outputs.build_id }}
          extensions: [apk]
      - uses: eas/install_maestro
      - uses: eas/start_android_emulator
        with:
          system_image_package: system-images;android-34;default;x86_64
      - name: Install the app
        run: adb install "${{ steps.download_build.outputs.artifact_path }}"
      - name: Run the smoke flows
        run: maestro test .maestro/smoke.yml --debug-output maestro-debug
      # Screenshots and the view hierarchy of a failed step.
      - uses: eas/upload_artifact
        if: ${{ failure() }}
        with:
          type: other
          name: maestro-debug
          path: maestro-debug/**/*
