# The maestro job of e2e-android.yml against an existing build, for when only
# the flows changed. The build must already have the testIDs the flows use:
#   npm run test:e2e-existing -- <build-id>       (smoke)
#   npm run test:e2e-existing:full -- <build-id>  (full)
# Keep the steps in sync with e2e-android.yml.
name: E2E Android (existing build)

on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
        description: ID of an e2e-test Android build
      suite:
        type: choice
        options: [smoke, full]
        default: smoke
        description: smoke for routine runs, full before a release

jobs:
  maestro:
    # Android emulators need a nested-virtualization worker.
    runs_on: linux-medium-nested-virtualization
    steps:
      - uses: eas/checkout
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ inputs.build_id }}
          extensions: [apk]
      - uses: eas/install_maestro
      - uses: eas/start_android_emulator
        with:
          system_image_package: system-images;android-34;default;x86_64
      - name: Install the app
        run: adb install "${{ steps.download_build.outputs.artifact_path }}"
      - name: Run the ${{ inputs.suite }} suite
        run: maestro test .maestro/${{ inputs.suite }}.yml --debug-output maestro-debug
      # The full suite ends with the quick workout on a German device. A
      # locale change needs root, which the default emulator image allows.
      - name: Switch the emulator to German
        if: ${{ success() && inputs.suite == 'full' }}
        run: |
          adb root
          adb wait-for-device
          adb shell "setprop persist.sys.locale de-DE; setprop ctl.restart zygote"
          adb wait-for-device
          # sys.boot_completed can still read 1 from before the restart, so
          # also wait for the new locale and a package manager that answers.
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] \
            && [ "$(adb shell getprop persist.sys.locale | tr -d '\r')" = "de-DE" ] \
            && adb shell pm path android > /dev/null 2>&1; do sleep 2; done
      - name: Run the German suite
        if: ${{ success() && inputs.suite == 'full' }}
        run: maestro test .maestro/german.yml --debug-output maestro-debug
      # Screenshots and the view hierarchy of a failed step.
      - uses: eas/upload_artifact
        if: ${{ failure() }}
        with:
          type: other
          name: maestro-debug
          # Maestro writes into a hidden .maestro folder, which a glob skips.
          path: maestro-debug
