name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - run: npm ci

      # google-services.json and assets/data/ are gitignored; stub them so
      # imports resolve for tsc and jest. app/_layout.tsx reads oauth_client[2]
      # at import time, so the stub needs three entries.
      - name: Stub gitignored local files
        run: |
          echo '{"client":[{"oauth_client":[{"client_id":""},{"client_id":""},{"client_id":""}]}]}' > google-services.json
          mkdir -p assets/data
          for f in $(grep -oh 'assets/data/[A-Za-z0-9_-]*\.json' utils/loadPremadePlans.ts | sort -u); do
            [ -f "$f" ] || echo '[]' > "$f"
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:ci

      # Fails below the per-directory floors in package.json
      # (jest.coverageThreshold).
      - name: Test
        run: npx jest --ci --coverage --coverageReporters=text-summary --coverageReporters=json-summary

      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
          const summary = require("./coverage/coverage-summary.json");
          const root = process.cwd() + "/";
          const pct = (covered, total) =>
            total ? ((100 * covered) / total).toFixed(1) + "%" : "n/a";
          const rows = [["All files", summary.total.lines, summary.total.branches]];
          for (const dir of ["store/", "utils/db/", "utils/", "hooks/"]) {
            const lines = { covered: 0, total: 0 };
            const branches = { covered: 0, total: 0 };
            for (const [file, entry] of Object.entries(summary)) {
              if (!file.startsWith(root + dir)) continue;
              lines.covered += entry.lines.covered;
              lines.total += entry.lines.total;
              branches.covered += entry.branches.covered;
              branches.total += entry.branches.total;
            }
            rows.push([dir, lines, branches]);
          }
          console.log("| Coverage | Lines | Branches |");
          console.log("| --- | --- | --- |");
          for (const [name, l, b] of rows) {
            console.log(`| ${name} | ${pct(l.covered, l.total)} | ${pct(b.covered, b.total)} |`);
          }
          ' >> "$GITHUB_STEP_SUMMARY"

      # Report only: unused files and dependencies (config in knip.json).
      - name: Unused code report
        continue-on-error: true
        run: npx --yes knip@6 --include files,dependencies,unlisted,binaries

  # Firestore security rules against the emulator (rules-tests/). The emulator
  # needs Java; the suite imports no app code, so no stubs are needed.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npm install -g firebase-tools@15

      - name: Rules tests
        run: npm run test:rules

  # Day attribution (streaks, the calendar, weekly goals) is computed in the
  # device's local timezone, so a suite that only ever runs at UTC cannot catch
  # a regression. These cover both sides of UTC, a half-hour offset, and a zone
  # observing DST during the northern summer.
  timezones:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        timezone:
          - Pacific/Auckland
          - Asia/Kathmandu
          - Europe/London
          - America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - run: npm ci

      - name: Stub gitignored local files
        run: |
          echo '{"client":[{"oauth_client":[{"client_id":""},{"client_id":""},{"client_id":""}]}]}' > google-services.json
          mkdir -p assets/data
          for f in $(grep -oh 'assets/data/[A-Za-z0-9_-]*\.json' utils/loadPremadePlans.ts | sort -u); do
            [ -f "$f" ] || echo '[]' > "$f"
          done

      - name: Test
        run: npx jest --ci
        env:
          TZ: ${{ matrix.timezone }}
